<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
    <link rel="icon" type="image/x-icon" href="src/bird.svg">
    <title>Bird game</title>
</head>
<body>
    <header>
        <img src="src/Final_bird_title.svg" alt="title" class="textInSite">
    </header>
    <main>
        <div id="retry">Retry</div>
        <div id="main_screen">
            <p id="score">Press SPACE to play</p>
            <div id="row1" class="obstacle"></div>
            <div id="lineUp" class="line"></div>
            <img src="src/bird.svg" alt="bird" id="bird">
            <div id="row2" class="obstacle"></div>
            <div id="lineDown" class="line"></div>
            <div id="row3" class="obstacle"></div>
        </div>
    </main>
    <footer>
        <img src="src/Final_falcons.svg" alt="Falcons" class="textInSite">
    </footer>
</body>
</html>
